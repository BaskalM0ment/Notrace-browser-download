<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoTrace Browser</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background:
    radial-gradient(circle at 15% 20%,
      rgba(255,255,255,0.14),
      transparent 25%),
    radial-gradient(circle at 85% 80%,
      rgba(255,255,255,0.10),
      transparent 30%),
    radial-gradient(circle at 50% 50%,
      rgba(255,255,255,0.05),
      transparent 50%),
    #000;

  font-family: Arial, sans-serif;
  color: white;

  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  font-size: 72px;
  margin-bottom: 20px;

  color: rgba(255,255,255,0.98);

  text-shadow:
    0 0 25px rgba(255,255,255,0.25),
    0 0 60px rgba(255,255,255,0.08);
}

.subtitle {
  font-size: 22px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 60px;
}

/* DOWNLOAD AREA */

.download-wrapper {
  position: relative;
  display: inline-block;
}

/* DOWNLOAD BUTTON */

.download-trigger {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 320px;
  height: 95px;

  border-radius: 999px;

  background: rgba(255,255,255,0.05);

  border: 1px solid rgba(255,255,255,0.12);

  backdrop-filter: blur(90px) saturate(250%);
  -webkit-backdrop-filter: blur(90px) saturate(250%);

  color: rgba(255,255,255,0.96);
  font-size: 28px;
  font-weight: 500;

  cursor: pointer;

  transition: all .35s ease;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.30),
    inset 0 -1px 0 rgba(255,255,255,0.03),
    0 20px 100px rgba(255,255,255,0.04);
}

.download-trigger:hover {
  transform: scale(1.05);

  background: rgba(255,255,255,0.08);

  border-color: rgba(255,255,255,0.22);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.40),
    0 25px 120px rgba(255,255,255,0.08);
}


/* POPUP */

.popup {
  position: absolute;

  top: 50%;
  left: calc(100% + 15px);

  transform: translateY(-50%) translateX(-10px);

  width: 440px;
  padding: 30px;

  border-radius: 34px;

  background: rgba(255,255,255,0.035);

  border: 1px solid rgba(255,255,255,0.10);

  backdrop-filter: blur(120px) saturate(280%);
  -webkit-backdrop-filter: blur(120px) saturate(280%);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity .35s ease,
    transform .35s ease;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 40px 120px rgba(255,255,255,0.04);

  z-index: 999;
}

/* KEEP OPEN */

.download-wrapper:hover .popup,
.popup:hover {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transform: translateY(-50%) translateX(0);
}

.popup-title {
  font-size: 30px;
  margin-bottom: 24px;

  color: rgba(255,255,255,0.95);
}

/* DOWNLOAD OPTIONS */

.download-option {
  display: block;

  width: 100%;

  text-decoration: none;
  color: white;

  padding: 20px 24px;
  margin-bottom: 18px;

  border-radius: 22px;

  background: rgba(255,255,255,0.025);

  border: 1px solid rgba(255,255,255,0.08);

  backdrop-filter: blur(70px);
  -webkit-backdrop-filter: blur(70px);

  transition: all .25s ease;
}

.download-option:hover {
  transform: scale(1.03);

  background: rgba(255,255,255,0.06);

  border-color: rgba(255,255,255,0.18);

  box-shadow:
    0 10px 50px rgba(255,255,255,0.04);
}


.platform {
  font-size: 22px;
  margin-bottom: 6px;
}

.filetype {
  color: rgba(255,255,255,0.6);
  font-size: 15px;
}

.version {
  margin-top: 40px;

  color: rgba(255,255,255,0.45);

  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

  <h1>NoTrace Browser</h1>

  <div class="subtitle">
    Fast. Private. Clean.
  </div>

  <div class="download-wrapper">

    <div class="download-trigger">
      Download
    </div>

    <div class="popup">

      <div class="popup-title">
        Download NoTrace
      </div>

      <a
        class="download-option"
        href="./downloads/NoTraceBrowserSetup.exe"
        download
      >
        <div class="platform">Windows</div>
        <div class="filetype">.exe installer</div>
      </a>

      <a
        class="download-option"
        href="./downloads/NoTraceBrowser.dmg"
        download
      >
        <div class="platform">macOS</div>
        <div class="filetype">.dmg package</div>
      </a>

      <a
        class="download-option"
        href="./downloads/NoTraceBrowser.AppImage"
        download
      >
        <div class="platform">Linux</div>
        <div class="filetype">.AppImage</div>
      </a>

    </div>

  </div>

  <div class="version">
    Version 1.0.0
  </div>

</div>

</body>
</html>
