<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoTrace Browser</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000000;
  font-family: Arial, sans-serif;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  font-size: 72px;
  font-weight: bold;
  margin-bottom: 20px;
  color: white;
}

.subtitle {
  font-size: 22px;
  color: #cfcfcf;
  margin-bottom: 60px;
}

.buttons {
  display: flex;
  gap: 25px;
  justify-content: center;
  flex-wrap: wrap;
}

.download-btn {
  display: inline-block;
  padding: 22px 45px;
  background: #050505;
  border-radius: 999px;
  color: white;
  text-decoration: none;
  font-size: 22px;
  transition: 0.2s;
  box-shadow:
    0 0 25px rgba(255,255,255,0.08),
    0 0 50px rgba(255,255,255,0.04);
}

.download-btn:hover {
  transform: scale(1.04);
  box-shadow:
    0 0 35px rgba(255,255,255,0.15),
    0 0 65px rgba(255,255,255,0.06);
}

.version {
  margin-top: 40px;
  color: #8a8a8a;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

  <h1>NoTrace Browser</h1>

  <div class="subtitle">
    Fast. Private. Clean.
  </div>

  <div class="buttons">

    <a class="download-btn"
       href="downloads/NoTraceBrowserSetup.exe"
       download>
       Download for Windows
    </a>

    <a class="download-btn"
       href="downloads/NoTraceBrowser.dmg"
       download>
       Download for macOS
    </a>

    <a class="download-btn"
       href="downloads/NoTraceBrowser.AppImage"
       download>
       Download for Linux
    </a>

  </div>

  <div class="version">
    Version 1.0.0
  </div>

</div>

</body>
</html>
