<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoTrace Browser</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#ffffff;
  font-family:Arial,sans-serif;
  color:#111;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  transition:all .4s ease;
}

.container{
  text-align:center;
}

h1{
  font-size:72px;
  margin-bottom:20px;
  color:#111;
}

.subtitle{
  font-size:22px;
  color:#555;
  margin-bottom:60px;
}

.download-wrapper{
  position:relative;
  display:inline-block;
}

.download-trigger{
  display:flex;
  align-items:center;
  justify-content:center;

  width:320px;
  height:95px;

  background:rgba(255,255,255,0);
  border-radius:16px;
  border:1px solid rgba(0,0,0,0.1);

  box-shadow:0 4px 30px rgba(0,0,0,0.1);

  backdrop-filter:blur(2.3px);
  -webkit-backdrop-filter:blur(2.3px);

  color:#111;
  font-size:28px;
  cursor:pointer;

  transition:.3s;
}

.download-trigger:hover{
  transform:scale(1.05);
}

.popup{
  position:absolute;
  top:50%;
  left:calc(100% + 15px);

  transform:translateY(-50%) translateX(-10px);

  width:440px;
  padding:30px;

  background:rgba(255,255,255,0);

  border-radius:16px;
  border:1px solid rgba(0,0,0,0.1);

  box-shadow:0 4px 30px rgba(0,0,0,0.1);

  backdrop-filter:blur(2.3px);
  -webkit-backdrop-filter:blur(2.3px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:.35s;

  z-index:999;
}

.download-wrapper:hover .popup,
.popup:hover{
  opacity:1;
  visibility:visible;
  pointer-events:auto;

  transform:translateY(-50%) translateX(0);
}

.popup-title{
  font-size:30px;
  margin-bottom:24px;
  color:#111;
}

.download-option{
  display:block;
  width:100%;

  text-decoration:none;
  color:#111;

  padding:20px 24px;
  margin-bottom:18px;

  background:rgba(255,255,255,0);

  border-radius:16px;
  border:1px solid rgba(0,0,0,0.1);

  box-shadow:0 4px 30px rgba(0,0,0,0.1);

  backdrop-filter:blur(2.3px);
  -webkit-backdrop-filter:blur(2.3px);

  transition:.25s;
}

.download-option:hover{
  transform:scale(1.03);
}

.platform{
  font-size:22px;
  margin-bottom:6px;
}

.filetype{
  color:#666;
  font-size:15px;
}

.version{
  margin-top:40px;
  color:#666;
  font-size:18px;
}

#themeToggle{
  position:fixed;
  top:20px;
  right:20px;

  width:55px;
  height:55px;

  border-radius:16px;
  border:1px solid rgba(0,0,0,0.1);

  background:rgba(255,255,255,0);

  backdrop-filter:blur(2.3px);
  -webkit-backdrop-filter:blur(2.3px);

  box-shadow:0 4px 30px rgba(0,0,0,0.1);

  cursor:pointer;
  font-size:22px;

  transition:.25s;
}

#themeToggle:hover{
  transform:scale(1.08);
}
</style>
</head>

<body>

<div class="container">

  <h1>NoTrace Browser</h1>

  <div class="subtitle">
    Fast. Private. Clean.
  </div>

  <div class="download-wrapper">

    <div class="download-trigger">
      Download
    </div>

    <div class="popup">

      <div class="popup-title">
        Download NoTrace
      </div>

      <a class="download-option" href="./downloads/NoTraceBrowserSetup.exe" download>
        <div class="platform">Windows</div>
        <div class="filetype">.exe installer</div>
      </a>

      <a class="download-option" href="./downloads/NoTraceBrowser.dmg" download>
        <div class="platform">macOS</div>
        <div class="filetype">.dmg package</div>
      </a>

      <a class="download-option" href="./downloads/NoTraceBrowser.AppImage" download>
        <div class="platform">Linux</div>
        <div class="filetype">.AppImage</div>
      </a>

    </div>

  </div>

  <div class="version">
    Version 1.0.0
  </div>

</div>

<button id="themeToggle">🌙</button>

<script>
const themeToggle = document.getElementById("themeToggle");
let darkMode = false;

themeToggle.addEventListener("click", () => {
  darkMode = !darkMode;

  if (darkMode) {
    document.body.style.background = "#000";
    document.body.style.color = "#fff";

    document.querySelector("h1").style.color = "#fff";
    document.querySelector(".subtitle").style.color = "#bbb";
    document.querySelector(".version").style.color = "#888";

    document.querySelector(".popup-title").style.color = "#fff";

    document.querySelectorAll(".download-option").forEach(el => {
      el.style.color = "#fff";
    });

    document.querySelector(".download-trigger").style.color = "#fff";

    themeToggle.innerHTML = "☀️";
    themeToggle.style.color = "#fff";
  } else {
    document.body.style.background = "#fff";
    document.body.style.color = "#111";

    document.querySelector("h1").style.color = "#111";
    document.querySelector(".subtitle").style.color = "#555";
    document.querySelector(".version").style.color = "#666";

    document.querySelector(".popup-title").style.color = "#111";

    document.querySelectorAll(".download-option").forEach(el => {
      el.style.color = "#111";
    });

    document.querySelector(".download-trigger").style.color = "#111";

    themeToggle.innerHTML = "🌙";
    themeToggle.style.color = "#111";
  }
});
</script>

</body>
</html>
